<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>First web</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f7f7f7}
    .container{max-width:720px;margin:40px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
    button{padding:10px 16px;border-radius:6px;border:none;background:#1a73e8;color:#fff;cursor:pointer}
    img.avatar{width:72px;height:72px;border-radius:50%}
  </style>
</head>
<body>
  <div class="container">
    <h1>First web</h1>
    <p id="status">Not signed in</p>
    <div id="user" style="display:none;align-items:center;gap:12px;">
      <img id="user-pic" class="avatar" src="" alt="avatar">
      <div>
        <div id="user-name"></div>
        <div id="user-email" style="color:#666;font-size:0.9em;"></div>
      </div>
    </div>
    <div style="margin-top:16px;">
      <button id="signin-btn">Sign in with Google</button>
      <button id="signout-btn" style="display:none;margin-left:8px;background:#e53935">Sign out</button>
    </div>
    <p style="margin-top:18px;color:#666;font-size:0.9em">This site uses Firebase Authentication (Google sign-in). See README for deployment steps.</p>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
